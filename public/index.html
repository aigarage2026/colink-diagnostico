<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colink — Diagnóstico de Processos</title>

<style>
/* ── RESET & TOKENS ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:           #FFFFFF;
  --surface:      #FAFAFA;
  --surface2:     #F4F4F5;
  --surface3:     #E4E4E7;
  --border:       #E4E4E7;
  --border-subtle:#F0F0F2;
  --text:         #09090B;
  --text-muted:   #71717A;
  --text-subtle:  #A1A1AA;
  --accent:       #18181B;
  --accent-fg:    #FAFAFA;
  --blue:         #2563EB;
  --green:        #16A34A;
  --red:          #DC2626;
  --amber:        #D97706;
  --r-sm:         4px;
  --r-md:         6px;
  --r-lg:         8px;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; overflow: hidden; }

/* ── APP SHELL ────────────────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ──────────────────────────────────────────────────────── */
.sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}
.sidebar-brand {
  height: 56px; display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: var(--r-md);
  background: #18181B; color: #FAFAFA;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; flex-shrink: 0;
}
.brand-name { font-size: 13px; font-weight: 600; color: var(--text); }
.brand-sub  { font-size: 10px; color: var(--text-muted); letter-spacing: .04em; }

.sidebar-nav { flex: 1; padding: 8px; overflow-y: auto; }
.nav-section { margin-bottom: 20px; }
.nav-label {
  font-size: 10px; font-weight: 600; letter-spacing: .08em;
  color: var(--text-subtle); text-transform: uppercase;
  padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: var(--r-md);
  font-size: 13px; font-weight: 500; color: var(--text-muted);
  cursor: pointer; transition: background .15s, color .15s;
  border: none; background: none; width: 100%; text-align: left;
  text-decoration: none;
}
.nav-item:hover { background: var(--surface3); color: var(--text); }
.nav-item.active { background: var(--surface2); color: var(--text); font-weight: 600; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto; font-size: 10px; font-weight: 600;
  background: #18181B; color: #FAFAFA;
  padding: 1px 6px; border-radius: 10px;
}

.sidebar-session {
  padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.session-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: var(--r-md);
  background: #F4F4F5; border: 1px solid #E4E4E7;
}
.session-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.session-dot.idle { background: var(--text-subtle); }
.session-info { flex: 1; min-width: 0; }
.session-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-meta { font-size: 10px; color: var(--text-muted); }
.session-btn {
  font-size: 11px; font-weight: 600; color: #2563EB;
  background: none; border: none; cursor: pointer; padding: 2px 4px;
  border-radius: var(--r-sm); flex-shrink: 0;
}
.session-btn:hover { background: #EFF6FF; }

/* ── MAIN AREA ────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ── TOPBAR ───────────────────────────────────────────────────────── */
.topbar {
  height: 56px; flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
}
.topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
.topbar-sub   { font-size: 11px; color: var(--text-muted); }
.topbar-divider { width: 1px; height: 16px; background: var(--border); }

.steps-row { display: flex; align-items: center; gap: 4px; flex: 1; }
.step-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 600; letter-spacing: .04em;
  background: var(--surface2); color: var(--text-muted);
  border: 1px solid var(--border);
  transition: all .15s; cursor: default; white-space: nowrap;
}
.step-pill.active { background: #18181B; color: #FAFAFA; border-color: #18181B; }
.step-pill.done   { background: #DCFCE7; color: #16A34A; border-color: #BBF7D0; }
.step-pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

.topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--r-md);
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all .15s; border: 1px solid transparent;
  text-decoration: none;
}
.btn-ghost { background: none; border-color: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--surface3); color: var(--text); border-color: var(--border); }
.btn-outline { background: none; border-color: var(--border); color: var(--text-muted); }
.btn-outline:hover { border-color: rgba(232,200,114,.3); color: var(--text); }
.btn-primary { background: #18181B; color: #FAFAFA; border-color: #18181B; }
.btn-primary:hover { background: #27272A; }
.btn svg { width: 13px; height: 13px; }

/* ── CHAT AREA ────────────────────────────────────────────────────── */
.chat-wrap { flex: 1; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; background: var(--bg); }
.chat-wrap::-webkit-scrollbar { width: 4px; }
.chat-wrap::-webkit-scrollbar-track { background: transparent; }
.chat-wrap::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 4px; }

.msg { display: flex; gap: 10px; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; margin-top: 2px;
}
.msg.assistant .msg-avatar { background: var(--surface3); color: var(--text-muted); border: 1px solid var(--border); }
.msg.user .msg-avatar { background: #18181B; color: #FAFAFA; }

.bubble {
  padding: 10px 14px; border-radius: var(--r-lg);
  font-size: 13px; line-height: 1.65; max-width: 75%;
  border: 1px solid transparent;
}
.msg.assistant .bubble { background: #F8F8F8; border-color: #E4E4E7; color: #09090B; border-radius: 2px var(--r-lg) var(--r-lg) var(--r-lg); }
.msg.user .bubble { background: #18181B; border-color: #18181B; color: #FAFAFA; border-radius: var(--r-lg) 2px var(--r-lg) var(--r-lg); }
.bubble b, .bubble strong { font-weight: 600; color: var(--text); }
.bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
.bubble th { background: #F4F4F5; padding: 6px 10px; text-align: left; font-weight: 600; font-size: 11px; border-bottom: 1px solid #E4E4E7; color: #09090B; }
.bubble td { padding: 6px 10px; border-bottom: 1px solid #F0F0F2; color: #09090B; }
.bubble code { background: #F4F4F5; color: #09090B; padding: 1px 5px; border-radius: var(--r-sm); font-size: 12px; font-family: monospace; }
.bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0; }
.bubble li { margin-bottom: 3px; }
.bubble h3 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
.bubble h2 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.bubble h1 { font-size: 15px; font-weight: 700; margin: 14px 0 8px; }
.bubble p { margin-bottom: 6px; }
.bubble p:last-child { margin-bottom: 0; }

/* Thinking bubble */
.thinking { display: flex; align-items: center; gap: 5px; padding: 10px 14px; }
.t-dot { width: 5px; height: 5px; border-radius: 50%; background: #A1A1AA; animation: tdot 1.2s ease-in-out infinite; }
.t-dot:nth-child(2) { animation-delay: .2s; }
.t-dot:nth-child(3) { animation-delay: .4s; }
@keyframes tdot { 0%,80%,100%{transform:scale(0.8);opacity:.4} 40%{transform:scale(1.2);opacity:1} }

/* File chips */
.file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--r-md);
  background: #F4F4F5; border: 1px solid #E4E4E7;
  font-size: 11px; font-weight: 500; color: #52525B;
}
.file-chip .chip-icon { font-size: 13px; }
.file-chip .chip-remove {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 9px; color: var(--text-subtle);
  transition: all .15s;
}
.file-chip .chip-remove:hover { background: var(--red); color: white; border-color: var(--red); }

/* Diagnosis banner */
.diag-banner {
  display: flex; align-items: center; gap: 12px;
  margin: 8px 0; padding: 10px 14px;
  background: #F0FDF4; border: 1px solid #BBF7D0;
  border-radius: var(--r-lg); font-size: 12px;
}
.diag-banner-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.diag-banner-text { color: var(--green); font-weight: 500; flex: 1; }
.diag-banner-btn {
  padding: 4px 10px; border-radius: var(--r-sm);
  background: var(--green); color: #0A0A0A;
  font-size: 11px; font-weight: 700; cursor: pointer;
  border: none; white-space: nowrap;
}

/* Error bubble */
.error-bubble {
  margin: 4px 0 4px 38px; padding: 8px 12px;
  background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2);
  border-radius: var(--r-md); font-size: 12px; color: var(--red);
}

/* ── INPUT AREA ───────────────────────────────────────────────────── */
.input-wrap {
  flex-shrink: 0; padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.pending-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.input-row {
  display: flex; align-items: flex-end; gap: 8px;
  background: #FFFFFF; border: 1px solid #D4D4D8;
  border-radius: var(--r-lg); padding: 8px 8px 8px 12px;
  transition: border-color .15s;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.input-row:focus-within { border-color: #18181B; }
.attach-btn {
  width: 30px; height: 30px; border-radius: var(--r-md);
  background: none; border: 1px solid #E4E4E7;
  color: #71717A; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s;
}
.attach-btn:hover { border-color: #18181B; color: #18181B; }
.attach-btn svg { width: 14px; height: 14px; }
#fileInput { display: none; }
.msg-input {
  flex: 1; background: none; border: none; outline: none;
  font-size: 13px; color: var(--text); resize: none;
  max-height: 120px; min-height: 22px; line-height: 1.5;
  font-family: inherit;
}
.msg-input::placeholder { color: var(--text-subtle); }
.send-btn {
  width: 32px; height: 32px; border-radius: var(--r-md);
  background: #18181B; color: #FAFAFA;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s;
}
.send-btn:hover { background: #27272A; }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.send-btn svg { width: 14px; height: 14px; }
.input-hint { margin-top: 6px; font-size: 10px; color: var(--text-subtle); display: flex; gap: 12px; }
.input-hint kbd {
  display: inline-flex; align-items: center;
  padding: 1px 5px; border-radius: 3px;
  background: #F4F4F5; border: 1px solid #E4E4E7;
  font-size: 9px; font-family: inherit; margin-right: 3px;
  color: #52525B;
}

/* ── SESSION MODAL ────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal {
  width: 100%; max-width: 480px;
  background: #FFFFFF;
  border: 1px solid #E4E4E7;
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.08);
}
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid #F0F0F2;
  background: #FAFAFA;
}
.modal-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.modal-sub { font-size: 12px; color: var(--text-muted); }
.modal-body { padding: 16px 24px; }
.field-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  letter-spacing: .06em; text-transform: uppercase;
  display: block; margin-bottom: 6px;
}
.field-input {
  width: 100%; padding: 9px 12px;
  background: #FFFFFF; border: 1px solid #D4D4D8;
  border-radius: var(--r-md); color: #09090B; font-size: 13px;
  font-family: inherit; outline: none; transition: border-color .15s;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.field-input:focus { border-color: #18181B; box-shadow: 0 0 0 3px rgba(24,24,27,.08); }
.field-input::placeholder { color: var(--text-subtle); }
.modal-footer { padding: 12px 24px 20px; display: flex; flex-direction: column; gap: 12px; }
.btn-create {
  width: 100%; padding: 10px;
  background: #18181B; color: #FAFAFA;
  border: none; border-radius: var(--r-md);
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: background .15s;
}
.btn-create:hover { background: #27272A; }
.divider-label { text-align: center; font-size: 11px; color: var(--text-subtle); position: relative; }
.divider-label::before, .divider-label::after {
  content: ''; position: absolute; top: 50%;
  width: calc(50% - 60px); height: 1px; background: var(--border);
}
.divider-label::before { left: 0; }
.divider-label::after  { right: 0; }

/* Sessions list */
.sessions-list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.sessions-list::-webkit-scrollbar { width: 3px; }
.sessions-list::-webkit-scrollbar-thumb { background: var(--surface3); }
.session-row {
  display: flex; align-items: center;
  padding: 10px 12px; border-radius: var(--r-md);
  border: 1px solid #E4E4E7; background: #FAFAFA;
  cursor: pointer; transition: all .15s;
}
.session-row:hover { border-color: #18181B; background: #F4F4F5; }
.session-row-badge {
  font-size: 10px; font-weight: 700; padding: 2px 6px;
  background: #18181B; color: #FAFAFA;
  border-radius: 4px; margin-right: 10px; flex-shrink: 0;
}
.session-row-info { flex: 1; min-width: 0; }
.session-row-name { font-size: 13px; font-weight: 600; color: var(--text); }
.session-row-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.session-row-arrow { color: #71717A; font-size: 13px; flex-shrink: 0; margin-left: 8px; }

/* ── MARKDOWN RENDERING ───────────────────────────────────────────── */
.rendered-md { font-size: 13px; line-height: 1.7; }
.rendered-md h1 { font-size: 15px; font-weight: 700; margin: 14px 0 8px; color: var(--text); }
.rendered-md h2 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.rendered-md h3 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: var(--accent); }
.rendered-md ul, .rendered-md ol { padding-left: 20px; margin: 4px 0; }
.rendered-md li { margin-bottom: 3px; }
.rendered-md code { background: #F4F4F5; color: #09090B; padding: 1px 5px; border-radius: var(--r-sm); font-size: 12px; font-family: 'Fira Code', monospace; }
.rendered-md table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
.rendered-md th { background: #F4F4F5; padding: 6px 10px; text-align: left; font-weight: 600; font-size: 11px; border: 1px solid #E4E4E7; color: #09090B; }
.rendered-md td { padding: 6px 10px; border: 1px solid #F0F0F2; vertical-align: top; color: #09090B; }
.rendered-md tr:nth-child(even) td { background: #FAFAFA; }
.rendered-md p { margin-bottom: 6px; }
.rendered-md p:last-child { margin-bottom: 0; }
.rendered-md strong { font-weight: 600; color: var(--text); }
.rendered-md blockquote { border-left: 3px solid #D4D4D8; padding: 6px 12px; margin: 8px 0; background: #FAFAFA; border-radius: 0 var(--r-md) var(--r-md) 0; }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">CO</div>
      <div>
        <div class="brand-name">Colink</div>
        <div class="brand-sub">DIAGNÓSTICO COM IA</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Diagnóstico</div>
        <button class="nav-item active" onclick="showSessionModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Conversa
        </button>
        <button class="nav-item" onclick="openReports()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Relatórios
          <span class="badge">11</span>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Sistema</div>
        <a href="/admin.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Admin
        </a>
      </div>
    </nav>

    <div class="sidebar-session">
      <div class="session-pill" id="sessionPill">
        <div class="session-dot idle" id="sessionDot"></div>
        <div class="session-info">
          <div class="session-name" id="sessionName">Nenhuma sessão</div>
          <div class="session-meta" id="sessionCode">Clique para iniciar</div>
        </div>
        <button class="session-btn" onclick="showSessionModal()">Trocar</button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar" id="sessionBar" style="display:none">
      <div>
        <div class="topbar-title" id="topbarTitle">—</div>
        <div class="topbar-sub">Metodologia 10 Steps Colink</div>
      </div>
      <div class="topbar-divider"></div>
      <div class="steps-row" id="stepsBar">
        <!-- Steps pills injected by JS -->
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline" onclick="openReports()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Relatórios
        </button>
        <button class="btn btn-ghost" onclick="showSessionModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova sessão
        </button>
      </div>
    </header>

    <!-- CHAT -->
    <div class="chat-wrap" id="chat"></div>

    <!-- INPUT -->
    <div class="input-wrap">
      <div class="pending-chips" id="pendingChips"></div>
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Anexar arquivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>

// ── MESSAGES ─────────────────────────────────────────────────────────────────
function addMessage(role, content, imgSrc, save = true) {
  const msg = document.createElement("div");
  msg.className = `msg ${role === "user" ? "user" : "assistant"}`;
  const avatar = document.createElement("div");

  avatar.textContent = role === "user" ? "VC" : "CO";
  msg.appendChild(avatar);

  if (imgSrc) {

  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

// ── MARKDOWN ──────────────────────────────────────────────────────────────────
function formatMarkdown(text) {
  text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*(.*?)\*/g, "<em>$1</em>");
  text = text.replace(/^### (.+)$/gm, "<p style=\"font-size:12px;font-weight:600;color:var(--accent);margin-top:12px;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;\">$1</p>");
  text = text.replace(/^## (.+)$/gm, "<p style=\"font-family:\'DM Serif Display\',serif;font-size:15px;margin-top:12px;margin-bottom:6px;\">$1</p>");
  text = text.replace(/^# (.+)$/gm, "<p style=\"font-family:\'DM Serif Display\',serif;font-size:17px;color:var(--accent);margin-bottom:8px;\">$1</p>");
  text = parseTable(text);
  text = text.replace(/^[-•] (.+)$/gm, "<li>$1</li>");
  text = text.replace(/^\d+\. (.+)$/gm, "<li>$1</li>");
  text = text.replace(/`([^`]+)`/g, "<code style=\"background:rgba(255,255,255,.07);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px;\">$1</code>");
  text = text.replace(/^---$/gm, "<hr style=\"border:none;border-top:1px solid var(--border);margin:10px 0;\">");
  text = text.split("\n\n").map(p => {
    if (p.trim() && !p.includes("<table") && !p.includes("<ul") && !p.includes("<p ") && !p.includes("<hr")) {
      return `<p>${p.replace(/\n/g, "<br>")}</p>`;
    }
    return p;
  }).join("\n");
  return text;
}

function parseTable(text) {
  const lines = text.split("\n");
  let result = [], inTable = false, tableHtml = "";
  for (const line of lines) {
    if (line.trim().startsWith("|")) {
      if (!inTable) {
        inTable = true;
        tableHtml = "<table><thead><tr>";
        line.split("|").filter(c => c.trim()).forEach(h => { tableHtml += `<th>${h.trim()}</th>`; });
        tableHtml += "</tr></thead><tbody>";
      } else if (line.includes("---")) { continue; }
      else {
        tableHtml += "<tr>";
        line.split("|").slice(1, -1).forEach(c => { tableHtml += `<td>${c.trim()}</td>`; });
        tableHtml += "</tr>";
      }
    } else {
      if (inTable) { tableHtml += "</tbody></table>"; result.push(tableHtml); inTable = false; tableHtml = ""; }
      result.push(line);
    }
  }
  if (inTable) { tableHtml += "</tbody></table>"; result.push(tableHtml); }
  return result.join("\n");
}

async function loadSessionList() {
  const list = document.getElementById("sessionsList");
  list.innerHTML = '<div class="empty-state" style="display:flex;flex-direction:column;align-items:center;gap:8px;"><span style="font-size:18px;">⏳</span><span>Carregando sessões...</span></div>';
  
  // Timeout controller - Railway can be slow on cold start
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  
  try {
    const r = await fetch("/api/sessions", { signal: controller.signal });
    clearTimeout(timeout);
    const data = await r.json();

    // DB still connecting — auto retry after 3s
    if (data.retry) {
      list.innerHTML = '<div class="empty-state" style="text-align:center;"><span style="font-size:16px;">🔄</span><br><span style="color:var(--muted);font-size:12px;">Conectando ao banco de dados...<br>aguarde um momento</span></div>';
      setTimeout(() => loadSessionList(), 3000);
      return;
    }
    
    if (!data.sessions || data.sessions.length === 0) {
      list.innerHTML = '<div class="empty-state" style="text-align:center;color:var(--muted);font-size:12px;">Nenhuma sessão encontrada.<br>Crie a primeira sessão acima.</div>';
      return;
    }
    
    list.innerHTML = "";
    data.sessions.sort((a, b) => b.updatedAt - a.updatedAt).forEach(s => {
      const item = document.createElement("div");
      item.className = "session-row";
      const msgs = s.messageCount || 0;
      item.innerHTML = `
        <div class="session-item-info">
          <div class="session-row-name">${s.clientName}</div>
          <div class="session-row-meta">${s.code} · ${msgs} msg${msgs!==1?'s':''} · ${formatDate(s.updatedAt)}</div>
        </div>
        <div class="session-item-code" style="color:var(--accent);font-size:11px;font-weight:600;">Abrir →</div>
      `;
      item.onclick = () => loadSession(s.id);
      list.appendChild(item);
    });
  } catch(e) {
    clearTimeout(timeout);
    const isTimeout = e.name === 'AbortError';
    list.innerHTML = `
      <div class="empty-state" style="text-align:center;">
        <div style="color:var(--danger);margin-bottom:8px;">${isTimeout ? '⏱ Conexão lenta — servidor iniciando...' : '⚠️ Erro ao carregar sessões.'}</div>
        <button onclick="loadSessionList()" style="background:var(--surface2);border:1px solid var(--border);color:var(--accent);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;">↺ Tentar novamente</button>
      </div>`;
  }
}

function formatDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

async function createSession() {
  const name = document.getElementById("clientNameInput").value.trim();
  if (!name) { alert("Informe o nome do cliente."); return; }

  try {
    const r = await fetch("/api/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clientName: name })
    });
    const data = await r.json();
    if (data.error) { errEl.textContent = data.error; return; }
    await loadSession(data.id, true);
  } catch(e) {
    errEl.textContent = "Erro ao criar sessão.";
  }
}

  const topTitle = document.getElementById("topbarTitle");

    if (data.messages && data.messages.length > 0) {
      // Restore existing conversation
      data.messages.forEach(m => {
        addMessage(m.role === "assistant" ? "ai" : "user", m.displayContent || m.content, m.imgSrc, false);
      });

      // Restore step
      const lastAI = [...data.messages].reverse().find(m => m.role === "assistant");
      if (lastAI) {
        const lr = (lastAI.content || "").toLowerCase();
        if (lr.includes("roadmap") || lr.includes("próximos passos")) updateSteps(5);
        else if (lr.includes("as-is") || lr.includes("situação atual")) updateSteps(4);

      }

      // New session — get greeting
      await getGreeting();
    }
  } catch(e) {
    addMessage("assistant", "Erro ao carregar sessão. Tente novamente.", null, false);
  }

  inputBox.focus();
}

const FILE_ICONS = { image:"🖼️", excel:"📊", pdf:"📄", word:"📝", text:"📋", unknown:"📎" };

function getFileCategory(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["jpg","jpeg","png","gif","webp"].includes(ext)) return "image";
  if (["xlsx","xls","csv"].includes(ext)) return "excel";
  if (ext === "pdf") return "pdf";
  if (["docx","doc"].includes(ext)) return "word";
  if (ext === "txt") return "text";
  return "unknown";
}

function formatBytes(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}

async function handleFileSelect(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  input.value = "";

  for (const file of files) {
    const category = getFileCategory(file.name);
    let fileObj;
    if (category === "image") {
      const b64 = await readAsBase64(file);
      fileObj = { type: "image", category, name: file.name, size: file.size, data: b64, mimeType: file.type };
    } else if (category === "excel") {
      const text = await readExcelAsText(file);
      fileObj = { type: "text_file", category, name: file.name, size: file.size, data: text };
    } else {
      const b64 = await readAsBase64(file);
      fileObj = { type: "server_extract", category, name: file.name, size: file.size, data: b64, mimeType: file.type };
    }
    pendingFiles.push(fileObj);
  }
  showPendingAttachment();
}

function readAsBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Erro ao ler arquivo"));
    r.readAsDataURL(file);
  });
}

async function readExcelAsText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:"array", cellFormula:true });
        let out = `=== EXCEL: ${file.name} ===\nAbas: ${wb.SheetNames.join(", ")}\n\n`;
        wb.SheetNames.forEach(name => {
          const ws = wb.Sheets[name];
          const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
          out += `--- ABA: ${name} (${range.e.r+1} linhas x ${range.e.c+1} colunas) ---\n`;
          out += "DADOS:\n" + XLSX.utils.sheet_to_csv(ws, { blankrows:false }) + "\n\n";
          const formulas = [];
          Object.keys(ws).forEach(cell => { if (!cell.startsWith("!") && ws[cell].f) formulas.push(`${cell}: =${ws[cell].f}`); });
          if (formulas.length) out += `FÓRMULAS (${formulas.length}):\n` + formulas.join("\n") + "\n\n";
        });
        res(out);
      } catch(err) { rej(err); }
    };
    r.onerror = () => rej(new Error("Erro ao ler Excel"));
    r.readAsArrayBuffer(file);
  });
}

function buildMessages(newUserContent) {
  const msgs = [{ role: "system", content: SYSTEM_PROMPT }];
  // Collect all messages from chat DOM
  const chatMsgs = document.querySelectorAll('#chat .msg');
  chatMsgs.forEach(m => {
    const isUser = m.classList.contains('user');
    const bubble = m.querySelector('.bubble');
    if (!bubble) return;
    const text = bubble.innerText || bubble.textContent || '';
    if (text.trim()) {
      msgs.push({ role: isUser ? 'user' : 'assistant', content: text.trim() });
    }
  });
  // Add the new user message (not yet in DOM)
  msgs.push({ role: 'user', content: newUserContent });
  // Keep max 40 messages to avoid token limit (system + last 39)
  if (msgs.length > 41) {
    const system = msgs[0];
    const recent = msgs.slice(-(40));
    return [system, ...recent];
  }
  return msgs;
}

async function send() {
  const text = inputBox.value.trim();
  if ((!text && !pendingFiles.length) || isLoading || !currentSessionId) return;

  inputBox.value = ""; inputBox.style.height = "auto";
  isLoading = true; sendBtn.disabled = true;

  const files = [...pendingFiles];
  clearPendingAttachment();

  // Show user messages in chat
  if (files.length > 0) {
    const fileChips = files.map(f => {
      const icons = {image:"🖼️", excel:"📊", pdf:"📄", word:"📝", text:"📋", document:"📄"};
      const icon = icons[f.category] || "📎";
      return icon + " **" + f.name + "**";
    }).join("\n");
    addMessage("user", (text ? text + "\n\n" : "") + fileChips, null, false);
  } else {
    addMessage("user", text, null, false);
  }

  // Build content for API — process all files
  let userMsgContent = "";
  let displayContent = text || "";

  if (files.length > 0) {
    showThinking();
    let filesText = text ? text + "\n\n" : "";
    const fileList = files.map(f => f.name).join(", ");
    filesText += `[ARQUIVOS RECEBIDOS: ${fileList}]\n`;
    filesText += `O usuário enviou ${files.length} arquivo(s) para análise. Analise PROFUNDAMENTE cada um, extraia métricas, números, padrões e problemas, e faça perguntas específicas baseadas nos dados reais encontrados.\n\n`;

    for (const file of files) {
      if (file.type === "image") {
        filesText += `[IMAGEM: ${file.name}] — Arquivo de imagem enviado para análise visual.\n`;
        sessionFileContents.push({ name: file.name, type: 'image', content: '[Imagem enviada para análise]' });
      } else if (file.type === "text_file") {
        filesText += file.data + "\n\n";
        sessionFileContents.push({ name: file.name, type: 'excel', content: file.data.slice(0, 8000) });
      } else if (file.type === "server_extract") {
        try {
          const resp = await fetch("/api/extract", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ name:file.name, data:file.data, mimeType:file.mimeType })
          });
          const result = await resp.json();
          filesText += result.text + "\n\n";
          sessionFileContents.push({ name: file.name, type: 'document', content: result.text.slice(0, 10000) });
        } catch(e) {
          filesText += `[Erro ao extrair ${file.name}]\n`;
        }
      }
    }
    removeThinking();

    // If single image, use vision
    if (files.length === 1 && files[0].type === "image") {
      const b64 = files[0].data.split(",")[1];
      userMsgContent = [
        { type:"image_url", image_url:{ url:`data:${files[0].mimeType};base64,${b64}`, detail:"high" } },
        { type:"text", text: text || "Analise esta imagem no contexto do diagnóstico de processos." }
      ];
    } else {
      userMsgContent = filesText;
    }

    displayContent = (text ? text + " — " : "") + files.map(f=>f.name).join(", ");
  } else {
    userMsgContent = text;
    displayContent = text;
  }

  showThinking();

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sessionId: currentSessionId,
        max_tokens: 2500,
        userDisplayContent: displayContent,
        messages: buildMessages(userMsgContent)
      })
    });
    const data = await r.json();
    removeThinking();

    if (data.error) {
      const e = document.createElement("div"); e.className = "error-bubble";
      e.textContent = "Erro: " + data.error.message; chat.appendChild(e);
    } else {
      const reply = data.choices[0].message.content;
      addMessage("assistant", reply, null, false);
      const lr = reply.toLowerCase();
      // Update progress bar
      if (lr.includes("roadmap") || lr.includes("próximos passos") || lr.includes("step 10") || lr.includes("diagnóstico completo")) updateSteps(5);
      else if (lr.includes("as-is") || lr.includes("situação atual") || lr.includes("step 9") || lr.includes("step 8")) updateSteps(4);
      else if (lr.includes("step 7") || lr.includes("step 6") || lr.includes("step 5") || lr.includes("gargalo")) updateSteps(3);
      else if (lr.includes("step 4") || lr.includes("step 3") || lr.includes("step 2") || lr.includes("como o processo")) updateSteps(2);
      // Detect diagnosis complete — show CTA banner
      const isDiagnosisComplete = (
        lr.includes("diagnóstico completo") ||
        (lr.includes("as-is") && lr.includes("to-be") && lr.includes("roadmap")) ||
        (lr.includes("próximos passos") && lr.includes("oportunidades") && lr.includes("roadmap")) ||
        (lr.includes("impacto financeiro") && lr.includes("roadmap"))
      );
      if (isDiagnosisComplete) {
        updateSteps(5);
        setTimeout(() => {
          const banner = document.createElement("div");
          banner.style.cssText = "background:linear-gradient(135deg,rgba(232,200,114,0.15),rgba(26,115,232,0.1));border:1px solid rgba(232,200,114,0.4);border-radius:12px;padding:16px 20px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;";
          banner.innerHTML = '<div><div style="font-weight:600;color:#e8c872;font-size:13px;margin-bottom:3px;">&#x2705; Diagnóstico concluído!</div><div style="font-size:12px;color:#9aa3b2;">Clique em Relatórios para baixar PDF, PPTX, Excel, Infográfico e mais.</div></div><button onclick="openReports()" style="background:#e8c872;color:#0d0e11;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;">&#x1F4C4; Gerar Relatórios</button>';
          chat.appendChild(banner);
          chat.scrollTop = chat.scrollHeight;
        }, 800);
      }
    }
  } catch(err) {
    removeThinking();
    const e = document.createElement("div"); e.className = "error-bubble";
    e.textContent = "Falha na conexão. Tente novamente."; chat.appendChild(e);
    chat.scrollTop = chat.scrollHeight;
  }

  isLoading = false; sendBtn.disabled = false; inputBox.focus();
}

async function callAIForReport(systemPrompt, userPrompt) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 140000); // 140s timeout
  try {
    const r = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal,
      body: JSON.stringify({
        type: 'report',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user',   content: userPrompt   }
        ]
      })
    });
    clearTimeout(timeout);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error?.message || 'Erro HTTP ' + r.status);
    }
    const data = await r.json();
    if (data.error) throw new Error(data.error.message || 'Erro da API');
    return data.choices[0].message.content;
  } catch(e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') throw new Error('Timeout após 140s. Tente novamente ou use uma sessão com menos mensagens.');
    throw e;
  }
}

function downloadBlob(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 100);
}

const progressTimers = {};

function setCardGenerating(id, generating) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const progress = card.querySelector('.rprogress');
  const done     = card.querySelector('.rdone');
  const bar      = card.querySelector('.rbar');
  const status   = card.querySelector('.rstatus');

  if (generating) {
    card.classList.add('generating');
    card.classList.remove('done');
    if (progress) progress.style.display = 'block';
    if (done)     done.style.display     = 'none';

    // Animate progress bar
    let pct = 0;
    let msgIdx = 0;
    const msgs = PROGRESS_MSGS[id] || ['Gerando...'];
    if (status) status.textContent = msgs[0];

    progressTimers[id] = setInterval(() => {
      // Non-linear progress — slows near 90%
      if (pct < 30)       pct += 8;
      else if (pct < 60)  pct += 5;
      else if (pct < 80)  pct += 2;
      else if (pct < 90)  pct += 0.5;
      // else wait for done

      if (bar) bar.style.width = Math.min(pct, 90) + '%';

      // Cycle through status messages
      const expectedMsg = Math.floor(pct / (90 / msgs.length));
      if (expectedMsg > msgIdx && expectedMsg < msgs.length) {
        msgIdx = expectedMsg;
        if (status) status.textContent = msgs[msgIdx];
      }
    }, 600);

  } else {
    // Done!
    clearInterval(progressTimers[id]);
    card.classList.remove('generating');
    card.classList.add('done');
    if (bar)    { bar.style.width = '100%'; bar.style.background = '#5fcb8e'; }
    if (status) status.textContent = 'Concluído!';
    setTimeout(() => {
      if (progress) progress.style.display = 'none';
      if (done)     done.style.display     = 'block';
      // Reset after 4s
      setTimeout(() => {
        card.classList.remove('done');
        if (done) done.style.display = 'none';
        if (bar)  { bar.style.width = '0%'; bar.style.background = ''; }
      }, 4000);
    }, 400);
  }
}

    const card = document.getElementById('card-' + type);
    if (card) {
      const status = card.querySelector('.rstatus');
      if (status) status.textContent = '⚠ ' + errMsg.slice(0, 60);
    }
  } finally {
    _reportLock[type] = false;
    setCardGenerating(type, false);
  }
}

  const nivelLabel  = d.nivel_label || nivelLabels[nivel];
  const nivelColor  = nivelColors[nivel];
  const stepsOk  = d.steps_ok  || [];
  const stepsNok = d.steps_nok || [];
  const gargalos = (d.gargalos     || []).slice(0,3);

  const dash = pct * circ;

  // Step pill row
  const stepPills = Array.from({length:10},(_,i)=>{
    const n = i+1;

  // Gargalo cards
  const gargaloCards = gargalos.map((g,i)=>{

<text x="100" y="${y+36}" font-family="Arial" font-size="10" fill="#64748B">${g.length>70?g.slice(70,110):''}</text>`;
  }).join('');

  // Oportunidades grid (2 columns)
  const oppStart = 278 + gargalos.length*62 + 20;
  const oppCards = opps.map((op,i)=>{
    const col = i%2===0 ? '#4A90E2' : '#A78BFA';

<rect x="${x+8}" y="${y+10}" width="${(op.tipo||'IA').length*7+10}" height="18" rx="9" fill="${typeCol}" fill-opacity=".2"/>
<text x="${x+8+(op.tipo||'IA').length*3.5+5}" y="${y+23}" font-family="Arial" font-size="9" fill="${typeCol}" text-anchor="middle" font-weight="700">${(op.tipo||'IA').slice(0,10)}</text>
<text x="${x+(op.tipo||'IA').length*7+28}" y="${y+22}" font-family="Arial" font-size="11" fill="#E8E9EC" font-weight="600">${(op.desc||'').slice(0,50)}</text>
<text x="${x+(op.tipo||'IA').length*7+28}" y="${y+37}" font-family="Arial" font-size="10" fill="#64748B">${(op.desc||'').slice(50,85)}</text>`;

  }).join('');

  const totalH = Math.max(H, qwStart + 44 + 40);

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${totalH}" width="${W}" height="${totalH}">

<!-- KPI cards -->
<rect x="28" y="100" width="210" height="100" rx="10" fill="#12151C" stroke="#1E2535" stroke-width="1"/>
<rect x="28" y="100" width="210" height="4" rx="2" fill="#F87171"/>
<text x="133" y="147" font-family="Georgia,serif" font-size="28" fill="${convAtual!='—'?'#F87171':'#4A5568'}" text-anchor="middle" font-weight="bold">${convAtual}</text>
<text x="133" y="168" font-family="Arial" font-size="10" fill="#64748B" text-anchor="middle">CONVERSÃO ATUAL</text>
<text x="133" y="186" font-family="Arial" font-size="9" fill="#64748B" text-anchor="middle" opacity=".6">Taxa de conversão do processo</text>

<rect x="252" y="100" width="210" height="100" rx="10" fill="#12151C" stroke="#1E2535" stroke-width="1"/>
<rect x="252" y="100" width="210" height="4" rx="2" fill="#3ECF8E"/>
<text x="357" y="147" font-family="Georgia,serif" font-size="28" fill="${convMeta!='—'?'#3ECF8E':'#4A5568'}" text-anchor="middle" font-weight="bold">${convMeta}</text>
<text x="357" y="168" font-family="Arial" font-size="10" fill="#64748B" text-anchor="middle">META TO-BE</text>

<text x="581" y="147" font-family="Georgia,serif" font-size="24" fill="${roi!='—'?'#E8C872':'#4A5568'}" text-anchor="middle" font-weight="bold">${roi}</text>

<rect x="700" y="100" width="210" height="4" rx="2" fill="#4A90E2"/>
<text x="805" y="147" font-family="Georgia,serif" font-size="28" fill="#4A90E2" text-anchor="middle" font-weight="bold">${stepsOk.length}/10</text>

<text x="805" y="186" font-family="Arial" font-size="9" fill="#64748B" text-anchor="middle" opacity=".6">Metodologia 10 Steps Colink</text>

<!-- Donut maturity -->
<circle cx="${donutCx}" cy="${donutCy}" r="${donutR}" fill="none" stroke="#1E2535" stroke-width="12"/>

  stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-dashoffset="${(circ/4).toFixed(1)}"

// ═══════════════════════════════════════════════════════════════════════
// BPMN — usa dados reais da IA, sem hardcode de atores
// ═══════════════════════════════════════════════════════════════════════
function generateBPMN(d, sessionName, today) {
  // Default with GENERIC actors (not SDR/Closer)
  if (!d || !d.asis || d.asis.length === 0) {
    d = {
      processo: sessionName, cliente: sessionName,
      atores: ['Responsável 1','Responsável 2','Sistema'],
      asis: [
        {ator:'Responsável 1',etapa:'Início do Processo',descricao:'Etapa inicial',problema:false,problema_desc:''},
        {ator:'Responsável 2',etapa:'Processamento',descricao:'Etapa principal',problema:true,problema_desc:'Sem padrão definido'},
        {ator:'Sistema',etapa:'Registro',descricao:'Cadastro manual',problema:true,problema_desc:'Propenso a erros'},
        {ator:'Responsável 1',etapa:'Verificação',descricao:'Checagem manual',problema:true,problema_desc:'Demora excessiva'},
        {ator:'Responsável 2',etapa:'Aprovação',descricao:'Sem critério definido',problema:true,problema_desc:'Gargalo principal'},
        {ator:'Sistema',etapa:'Finalização',descricao:'Output do processo',problema:false,problema_desc:''},
      ],
      tobe: [
        {ator:'Sistema',etapa:'Entrada Automática',descricao:'Trigger automático',automacao:'Integração',sla:'Imediato'},
        {ator:'Sistema',etapa:'Validação',descricao:'Regras automáticas',automacao:'RPA',sla:'<1min'},
        {ator:'Responsável 1',etapa:'Execução',descricao:'Processo padronizado',automacao:'',sla:'2h'},
        {ator:'Sistema',etapa:'Score/Critério',descricao:'Avaliação automática',automacao:'RPA',sla:'Automático'},
        {ator:'Responsável 2',etapa:'Revisão',descricao:'Aprovação simplificada',automacao:'',sla:'4h'},
        {ator:'Sistema',etapa:'Output Automático',descricao:'Gerado por IA',automacao:'Agente IA',sla:'<5min'},
      ],
      gargalos: ['Processo sem padrão operacional definido','Cadastros manuais propensos a erros','Aprovações sem critério claro']
    };
  }

  const atores  = d.atores && d.atores.length ? d.atores : ['Ator 1','Ator 2','Sistema'];
  const asis    = d.asis  || [];
  const tobe    = d.tobe  || [];
  const gargs   = d.gargalos || [];

  const LANE_H = 110, LABEL_W = 120, STEP_W = 155, STEP_H = 58, STEP_GAP = 28;
  const COLORS  = ['#4A90E2','#A78BFA','#3ECF8E','#FB923C','#F87171','#2DD4BF','#E8C872'];

  function buildDiag(steps, title, isToBe) {
    // Build actor list from steps (use only actors that appear)
    const actorSet = [...new Set(steps.map(s => s.ator || '').filter(Boolean))];
    // Merge with d.atores keeping order
    const lanes = atores.filter(a => actorSet.some(u =>
      u.toLowerCase().includes(a.toLowerCase().split(' ')[0]) ||
      a.toLowerCase().includes(u.toLowerCase().split(' ')[0])
    ));
    // Add any actors from steps not in d.atores
    actorSet.forEach(u => {
      if (!lanes.some(a => u.toLowerCase().includes(a.toLowerCase().split(' ')[0]) || a.toLowerCase().includes(u.toLowerCase().split(' ')[0]))) {
        lanes.push(u);
      }
    });
    const useLanes = lanes.length > 0 ? lanes : actorSet.slice(0,4);

    const W = LABEL_W + steps.length * (STEP_W + STEP_GAP) + 60;
    const H = useLanes.length * LANE_H + 56;

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W}px;display:block">`;
    svg += `<rect width="${W}" height="${H}" fill="#0A0C10"/>`;
    svg += `<rect x="0" y="0" width="${W}" height="46" fill="#0F1B35"/>`;
    svg += `<text x="16" y="20" font-family="Georgia,serif" font-size="13" fill="#E8C872" font-weight="bold">${title}</text>`;
    svg += `<text x="16" y="38" font-family="Arial" font-size="10" fill="#64748B">${d.cliente||sessionName} · ${d.processo||sessionName} · ${today}</text>`;

    useLanes.forEach((a, li) => {
      const y   = 46 + li * LANE_H;
      const col = COLORS[li % COLORS.length];
      svg += `<rect x="0" y="${y}" width="${W}" height="${LANE_H}" fill="${col}" opacity="0.05"/>`;
      svg += `<rect x="0" y="${y}" width="${LABEL_W}" height="${LANE_H}" fill="${col}" opacity="0.12"/>`;
      svg += `<line x1="${LABEL_W}" y1="${y}" x2="${W}" y2="${y}" stroke="#1E2535" stroke-width="0.8"/>`;
      svg += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#1E2535" stroke-width="0.5"/>`;
      // Actor label - fit text
      const label = a.length > 14 ? a.slice(0,13)+'…' : a;
      svg += `<text x="${LABEL_W/2}" y="${y+LANE_H/2+4}" font-family="Arial" font-size="11" fill="${col}" text-anchor="middle" font-weight="600" transform="rotate(-90,${LABEL_W/2},${y+LANE_H/2})">${label}</text>`;
    });
    svg += `<rect x="${LABEL_W}" y="46" width="1" height="${useLanes.length*LANE_H}" fill="#252D3D"/>`;

    steps.forEach((step, si) => {
      const actorName = step.ator || useLanes[0];
      let li = useLanes.findIndex(a =>
        a.toLowerCase().includes(actorName.toLowerCase().split(' ')[0]) ||
        actorName.toLowerCase().includes(a.toLowerCase().split(' ')[0])
      );
      if (li < 0) li = si % useLanes.length;
      const col = COLORS[li % COLORS.length];
      const bx = LABEL_W + 16 + si * (STEP_W + STEP_GAP);
      const by = 46 + li * LANE_H + (LANE_H - STEP_H) / 2;
      const cx = bx + STEP_W/2;
      const hasProb = step.problema && !isToBe;
      const hasAuto = isToBe && step.automacao;
      const boxCol  = hasProb ? '#F87171' : hasAuto ? '#3ECF8E' : col;
      const boxFill = hasProb ? 'rgba(248,113,113,.1)' : hasAuto ? 'rgba(62,207,142,.1)' : `rgba(74,144,226,.05)`;

      svg += `<rect x="${bx}" y="${by}" width="${STEP_W}" height="${STEP_H}" rx="8" fill="${boxFill}" stroke="${boxCol}" stroke-width="${hasProb?2:1}" stroke-dasharray="${hasProb?'5 3':'none'}"/>`;

      // Step label (2 lines max)
      const e1 = (step.etapa||'').slice(0,22);
      const e2 = (step.etapa||'').length > 22 ? (step.etapa||'').slice(22,42) : '';
      const d1 = (step.descricao||'').slice(0,28);
      svg += `<text x="${cx}" y="${by+(e2?13:17)}" font-family="Arial" font-size="11" fill="${hasProb||hasAuto?boxCol:'#E8E9EC'}" text-anchor="middle" font-weight="600">${e1}</text>`;
      if (e2) svg += `<text x="${cx}" y="${by+26}" font-family="Arial" font-size="10" fill="${hasProb||hasAuto?boxCol:'#C8D0E0'}" text-anchor="middle">${e2}</text>`;
      svg += `<text x="${cx}" y="${by+STEP_H-8}" font-family="Arial" font-size="9" fill="#64748B" text-anchor="middle">${d1}</text>`;

      if (hasProb) svg += `<text x="${bx+STEP_W-6}" y="${by+14}" font-family="Arial" font-size="14" fill="#F87171">⚠</text>`;

      if (hasAuto && step.automacao) {
        const bl = step.automacao.length * 6 + 12;
        svg += `<rect x="${bx+4}" y="${by+STEP_H-15}" width="${bl}" height="12" rx="6" fill="#3ECF8E"/>`;
        svg += `<text x="${bx+4+bl/2}" y="${by+STEP_H-6}" font-family="Arial" font-size="8" fill="#0A0C10" text-anchor="middle" font-weight="bold">${step.automacao}</text>`;
      }
      if (isToBe && step.sla) {
        svg += `<text x="${cx}" y="${46+li*LANE_H+LANE_H-6}" font-family="Arial" font-size="9" fill="#64748B" text-anchor="middle">⏱ ${step.sla}</text>`;
      }

      // Arrow
      if (si < steps.length - 1) {
        const nextActor = steps[si+1].ator || useLanes[0];
        let nli = useLanes.findIndex(a =>
          a.toLowerCase().includes(nextActor.toLowerCase().split(' ')[0]) ||
          nextActor.toLowerCase().includes(a.toLowerCase().split(' ')[0])
        );
        if (nli < 0) nli = (si+1) % useLanes.length;
        const ax1 = bx + STEP_W, ay1 = by + STEP_H/2;
        const ax2 = ax1 + STEP_GAP, ay2 = 46 + nli*LANE_H + LANE_H/2;
        if (li === nli) {
          svg += `<line x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay1}" stroke="#2A3548" stroke-width="1.5" marker-end="url(#arw${isToBe?'T':'A'})"/>`;
        } else {
          const mx = ax1 + STEP_GAP/2;
          svg += `<path d="M${ax1} ${ay1} L${mx} ${ay1} L${mx} ${ay2} L${ax2} ${ay2}" fill="none" stroke="#2A3548" stroke-width="1.5" marker-end="url(#arw${isToBe?'T':'A'})"/>`;
        }
      }
    });

    svg += `<defs><marker id="arw${isToBe?'T':'A'}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2A3548"/></marker></defs>`;
    svg += `</svg>`;
    return { svg, w: W, h: H };
  }

  const asisD = buildDiag(asis, 'PROCESSO AS-IS — SITUAÇÃO ATUAL', false);
  const tobeD = buildDiag(tobe, 'PROCESSO TO-BE — FUTURO COM IA',  true);

  return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Processo em Caixinhas — ${sessionName}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0C10;font-family:Arial,sans-serif;padding:32px 24px;color:#E8E9EC}
.page{max-width:1300px;margin:0 auto}
h1{font-family:Georgia,serif;color:#E8C872;font-size:22px;margin-bottom:4px}
.sub{color:#64748B;font-size:12px;margin-bottom:32px}

// MAPA MENTAL — layout sem sobreposição
// ═══════════════════════════════════════════════════════════════════════
function generateMindMap(d, sessionName) {
  const ramos = d ? (d.ramos || []) : [];
  const centro = d ? (d.centro || sessionName) : sessionName;

  // Canvas dimensions
  const W = 1200, H = 800;
  const CX = W/2, CY = H/2;
  const BRANCH_R = 230;  // branch node distance from center
  const LEAF_R   = 160;  // leaf distance from branch

  // Build HTML nodes + SVG lines
  let nodesHTML = '';
  let linesJS   = '';

  // Center node
  nodesHTML += `<div class="cn" style="left:${CX}px;top:${CY}px">${centro}</div>\n`;

  ramos.forEach((r, i, arr) => {
    // Evenly distributed angles, starting from top
    const angle = (i / arr.length) * 2 * Math.PI - Math.PI / 2;
    const bx = CX + Math.cos(angle) * BRANCH_R;
    const by = CY + Math.sin(angle) * BRANCH_R;

    nodesHTML += `<div class="bn" style="left:${bx.toFixed(0)}px;top:${by.toFixed(0)}px;background:${r.cor};box-shadow:0 0 20px ${r.cor}33">${r.label}</div>\n`;
    linesJS   += `L(${CX},${CY},${bx.toFixed(0)},${by.toFixed(0)},"${r.cor}",2.5,0.5);\n`;

    const filhos = r.filhos || [];
    const count  = filhos.length;

    filhos.forEach((f, j) => {
      // Fan out leaves: spread them so they don't overlap
      // Spread angle: narrower fan for fewer children
      const spread = Math.min(0.8, 0.3 * count);
      const la = angle + (j - (count-1)/2) * (count > 1 ? spread/(count-1) : 0);
      const lx = bx + Math.cos(la) * LEAF_R;
      const ly = by + Math.sin(la) * LEAF_R;

      nodesHTML += `<div class="ln" style="left:${lx.toFixed(0)}px;top:${ly.toFixed(0)}px;border-color:${r.cor}44">${f}</div>\n`;
      linesJS   += `L(${bx.toFixed(0)},${by.toFixed(0)},${lx.toFixed(0)},${ly.toFixed(0)},"${r.cor}",1.5,0.35);\n`;
    });
  });

  return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa Mental — ${sessionName}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0C10;font-family:Arial,sans-serif;padding:24px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h2{font-family:Georgia,serif;color:#E8C872;font-size:18px;margin-bottom:20px}
.wrap{position:relative;width:${W}px;height:${H}px;flex-shrink:0}
svg.lines{position:absolute;inset:0;pointer-events:none;overflow:visible}
.cn{
  position:absolute;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#0F1B35,#1A3A6E);
  color:#E8C872;border-radius:50%;width:130px;height:130px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:700;font-size:13px;padding:14px;
  border:2px solid rgba(232,200,114,.3);z-index:10;
  box-shadow:0 0 40px rgba(232,200,114,.15)
}
.bn{
  position:absolute;transform:translate(-50%,-50%);
  border-radius:10px;padding:8px 16px;
  font-size:11px;font-weight:700;color:#0A0C10;
  text-align:center;z-index:8;white-space:nowrap;
  min-width:80px
}
.ln{
  position:absolute;transform:translate(-50%,-50%);
  background:#12151C;border:1px solid #252D3D;
  border-radius:8px;padding:6px 10px;
  font-size:10px;color:#94A3B8;
  text-align:center;z-index:6;
  max-width:148px;line-height:1.35;word-break:break-word
}
footer{color:#334155;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<h2>Mapa Mental — ${sessionName}</h2>
<div class="wrap">
  <svg class="lines" id="sv" viewBox="0 0 ${W} ${H}"></svg>
  ${nodesHTML}
</div>
<footer>Colink Business Consulting · Diagnóstico com IA</footer>
<script>
(function(){
  var sv = document.getElementById('sv');
  function L(x1,y1,x2,y2,color,w,op){
    var e = document.createElementNS('http://www.w3.org/2000/svg','line');
    e.setAttribute('x1',x1); e.setAttribute('y1',y1);
    e.setAttribute('x2',x2); e.setAttribute('y2',y2);
    e.setAttribute('stroke',color);
    e.setAttribute('stroke-width',w);
    e.setAttribute('opacity',op);
    sv.appendChild(e);
  }
  ${linesJS}
})();
<\/script>
<\/body>
<\/html>`;
}


function generatePPTPreview(d, today) {

  const slideHTML = slides.map((sl, i) => {
    let body = '';
    if (sl.tipo === 'cover') {
      body = `<div class="cover-body"><div class="cover-title">${sl.conteudo || ''}</div><div class="cover-meta">${cli} · ${today}</div></div>`;
    } else if (sl.tipo === 'bullets' && Array.isArray(sl.conteudo)) {
      body = `<ul class="bullets">${sl.conteudo.map(b => `<li>${b}</li>`).join('')}</ul>`;
    } else if (sl.tipo === 'table' && Array.isArray(sl.conteudo)) {
      body = `<table><thead><tr>${sl.conteudo[0].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${sl.conteudo.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  return `<!DOCTYPE html>

// DECISION TREE — Fluxograma de Árvore de Decisão
// ═══════════════════════════════════════════════════════════════════════
function generateDecisionTree(d, sessionName, today) {
  const titulo = d ? d.titulo : 'Árvore de Decisão — ' + sessionName;
  const descricao = d ? d.descricao : 'Guia de decisão para transformação do processo';
  const raiz = d ? d.raiz : null;

  // Build node list from nested structure
  const nodes = [];
  const edges = [];
  let nodeId = 0;

  function traverse(node, parentId, edgeLabel, depth, x, spanWidth) {
    if (!node) return;
    const id = nodeId++;
    const isLeaf = !!node.acao;
    const typeColors = {
      sucesso: { bg: 'rgba(62,207,142,.15)', border: '#3ECF8E', text: '#3ECF8E', icon: '✓' },
      acao:    { bg: 'rgba(74,144,226,.15)', border: '#4A90E2', text: '#4A90E2', icon: '→' },
      urgente: { bg: 'rgba(251,146,60,.15)', border: '#FB923C', text: '#FB923C', icon: '⚡' },
      critico: { bg: 'rgba(248,113,113,.15)', border: '#F87171', text: '#F87171', icon: '⚠' },
    };
    const leafStyle = typeColors[node.tipo] || typeColors.acao;

    nodes.push({
      id, parentId, edgeLabel, depth, x,
      text: isLeaf ? node.acao : node.pergunta,
      isLeaf, isQuestion: !isLeaf,
      impacto: node.impacto || '',
      prazo: node.prazo || '',
      leafStyle: isLeaf ? leafStyle : null,
      tipo: node.tipo || ''
    });

    if (!isLeaf) {
      const half = spanWidth / 2;
      if (node.sim) traverse(node.sim, id, 'SIM', depth + 1, x - half / 2, half);
      if (node.nao) traverse(node.nao, id, 'NÃO', depth + 1, x + half / 2, half);
    }
  }

  const defaultRaiz = {
    pergunta: 'Processo está documentado?',
    sim: {
      pergunta: 'Dados estão íntegros?',
      sim: { acao: 'Avançar para automação', tipo: 'sucesso', impacto: 'Alto', prazo: '3-6m' },
      nao: { acao: 'Limpar base de dados', tipo: 'urgente', impacto: 'Alto', prazo: '0-3m' }
    },
    nao: {
      pergunta: 'Há POP existente?',
      sim: { acao: 'Formalizar e comunicar POP', tipo: 'acao', impacto: 'Alto', prazo: '0-3m' },
      nao: { acao: 'Workshop de mapeamento urgente', tipo: 'critico', impacto: 'Crítico', prazo: 'Imediato' }
    }
  };

  traverse(raiz || defaultRaiz, null, null, 0, 500, 800);

  // Layout: calculate y positions by depth
  const depthMap = {};
  nodes.forEach(n => {
    if (!depthMap[n.depth]) depthMap[n.depth] = [];
    depthMap[n.depth].push(n);
  });

  const LEVEL_H = 160, NODE_W = 200, NODE_H = 70;
  const maxDepth = Math.max(...nodes.map(n => n.depth));
  const totalH = (maxDepth + 1) * LEVEL_H + 120;
  const totalW = 1100;

  // Redistribute x positions evenly per level
  Object.keys(depthMap).forEach(dep => {
    const level = depthMap[dep];
    const gap = totalW / (level.length + 1);
    level.forEach((n, i) => { n.x = gap * (i + 1); });
  });

  // Assign y
  nodes.forEach(n => { n.y = 80 + n.depth * LEVEL_H; });

  // Build edges
  nodes.forEach(n => {
    if (n.parentId !== null) {
      const parent = nodes[n.parentId];
      if (parent) {
        edges.push({ x1: parent.x, y1: parent.y + NODE_H, x2: n.x, y2: n.y, label: n.edgeLabel });
      }
    }
  });

  // Render SVG
  let svgEdges = edges.map(e => {
    const mx = (e.x1 + e.x2) / 2;
    const my = (e.y1 + e.y2) / 2;
    const isYes = e.label === 'SIM';
    const col = isYes ? '#3ECF8E' : '#F87171';
    return `<path d="M${e.x1},${e.y1} C${e.x1},${my} ${e.x2},${my} ${e.x2},${e.y2}" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.5"/>
    <rect x="${mx - 16}" y="${my - 9}" width="32" height="18" rx="9" fill="${isYes ? 'rgba(62,207,142,.2)' : 'rgba(248,113,113,.2)'}"/>
    <text x="${mx}" y="${my + 5}" text-anchor="middle" font-family="Arial" font-size="10" fill="${col}" font-weight="bold">${e.label}</text>`;
  }).join('');

  let svgNodes = nodes.map(n => {
    if (n.isLeaf) {
      const s = n.leafStyle;
      return `<rect x="${n.x - NODE_W/2}" y="${n.y}" width="${NODE_W}" height="${NODE_H}" rx="10" fill="${s.bg}" stroke="${s.border}" stroke-width="1.5"/>
      <text x="${n.x - NODE_W/2 + 8}" y="${n.y + 16}" font-family="Arial" font-size="14" fill="${s.text}">${s.icon}</text>
      <foreignObject x="${n.x - NODE_W/2 + 6}" y="${n.y + 4}" width="${NODE_W - 12}" height="${NODE_H - 12}">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:11px;color:${s.text};line-height:1.35;padding-top:4px;padding-left:18px">${n.text.slice(0,80)}</div>
      </foreignObject>
      ${n.prazo ? `<rect x="${n.x - NODE_W/2 + 4}" y="${n.y + NODE_H - 18}" width="${n.prazo.length * 7 + 8}" height="14" rx="7" fill="${s.border}" opacity="0.3"/>
      <text x="${n.x - NODE_W/2 + 8}" y="${n.y + NODE_H - 7}" font-family="Arial" font-size="8" fill="${s.text}">${n.prazo}</text>` : ''}`;
    } else {
      // Decision diamond (using rotated rect visually approximated)
      const DW = NODE_W, DH = NODE_H;
      return `<rect x="${n.x - DW/2}" y="${n.y}" width="${DW}" height="${DH}" rx="6" fill="rgba(26,115,232,.1)" stroke="#4A90E2" stroke-width="1.5"/>
      <polygon points="${n.x},${n.y} ${n.x+14},${n.y+14} ${n.x},${n.y+28} ${n.x-14},${n.y+14}" fill="#4A90E2" opacity="0.8"/>
      <foreignObject x="${n.x - DW/2 + 4}" y="${n.y + 8}" width="${DW - 8}" height="${DH - 16}">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:11px;color:#E8E9EC;line-height:1.35;text-align:center;padding:2px 4px">${n.text.slice(0,70)}</div>
      </foreignObject>`;
    }
  }).join('');

  return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árvore de Decisão — ${sessionName}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0C10;font-family:Arial,sans-serif;padding:32px;color:#E8E9EC}
.page{max-width:1200px;margin:0 auto}
h1{font-family:Georgia,serif;color:#E8C872;font-size:22px;margin-bottom:4px}
.sub{color:#64748B;font-size:12px;margin-bottom:8px}
.desc{color:#94A3B8;font-size:13px;margin-bottom:28px;padding:10px 14px;background:#12151C;border-radius:8px;border-left:3px solid #4A90E2}
.diagram{background:#0A0C10;border:1px solid #1E2535;border-radius:12px;overflow-x:auto;padding:8px}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:14px 18px;background:#12151C;border:1px solid #1E2535;border-radius:10px;margin-top:12px}
.li{display:flex;align-items:center;gap:8px;font-size:11px;color:#94A3B8}
.lb{width:36px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold}
footer{text-align:center;font-size:11px;color:#334155;margin-top:28px;padding-top:14px;border-top:1px solid #1E2535}
</style>
</head>
<body>
<div class="page">
<h1>Árvore de Decisão — ${sessionName}</h1>
<div class="sub">${today} · Colink Business Consulting</div>
<div class="desc">${descricao}</div>
<div class="diagram">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${totalH}" width="100%" style="min-width:${totalW}px">
<rect width="${totalW}" height="${totalH}" fill="#0A0C10"/>
${svgEdges}
${svgNodes}
</svg>
</div>
<div class="legend">
  <div class="li"><div class="lb" style="background:rgba(62,207,142,.2);border:1px solid #3ECF8E;color:#3ECF8E">✓</div>Ação de sucesso</div>
  <div class="li"><div class="lb" style="background:rgba(74,144,226,.2);border:1px solid #4A90E2;color:#4A90E2">→</div>Ação necessária</div>
  <div class="li"><div class="lb" style="background:rgba(251,146,60,.2);border:1px solid #FB923C;color:#FB923C">⚡</div>Urgente</div>
  <div class="li"><div class="lb" style="background:rgba(248,113,113,.2);border:1px solid #F87171;color:#F87171">⚠</div>Crítico — agir agora</div>
  <div class="li"><div class="lb" style="background:rgba(26,115,232,.12);border:1px solid #4A90E2">◆</div>Ponto de decisão</div>
  <div class="li" style="color:#475569">Siga as setas: verde = SIM · vermelho = NÃO</div>
</div>
<footer>Colink Business Consulting · colink.com.br · ${today}</footer>
</div>
</body>
</html>`;
}

// TREE DIAGRAM — Diagrama de Árvore Gerencial
// ═══════════════════════════════════════════════════════════════════════

  const objetivo = d ? d.objetivo : 'Transformação Operacional com IA';

  const defaultNiveis = [
    {id:'L1-1',pai:null,nivel:1,label:'Estruturar o Processo',tipo:'fase',descricao:'0-3 meses',cor:'#4A90E2'},
    {id:'L1-2',pai:null,nivel:1,label:'Digitalizar',tipo:'fase',descricao:'3-6 meses',cor:'#3ECF8E'},

    {id:'L2-4',pai:'L1-2',nivel:2,label:'Pipeline completo CRM',tipo:'tarefa',descricao:'HubSpot configurado',cor:'#3ECF8E'},
    {id:'L2-5',pai:'L1-2',nivel:2,label:'Follow-up automático',tipo:'tarefa',descricao:'RPA Workflow',cor:'#3ECF8E'},
    {id:'L2-6',pai:'L1-3',nivel:2,label:'Agente IA qualificação',tipo:'tarefa',descricao:'GPT-4o integrado',cor:'#A78BFA'},
    {id:'L2-7',pai:'L1-3',nivel:2,label:'Proposta automática',tipo:'tarefa',descricao:'Geração via IA',cor:'#A78BFA'},
    {id:'L3-1',pai:'L2-1',nivel:3,label:'Entrevistar SDRs',tipo:'subtarefa',descricao:'2h Colink',cor:'#6EA8E8'},
    {id:'L3-2',pai:'L2-1',nivel:3,label:'Mapear exceções',tipo:'subtarefa',descricao:'Closers + Gestor',cor:'#6EA8E8'},
    {id:'L3-3',pai:'L2-4',nivel:3,label:'Configurar estágios',tipo:'subtarefa',descricao:'HubSpot Admin',cor:'#6ED4A8'},
  ];
  const items = niveis.length > 0 ? niveis : defaultNiveis;

  // Build tree structure
  const byId = {};
  items.forEach(it => { byId[it.id] = { ...it, children: [] }; });
  const roots = [];
  items.forEach(it => {
    if (it.pai && byId[it.pai]) byId[it.pai].children.push(byId[it.id]);
    else if (!it.pai) roots.push(byId[it.id]);
  });

  // Render as horizontal tree HTML with connectors
  function renderNode(node, depth) {
    const typeStyles = {
      fase: `background:rgba(${hexToRgb(node.cor)},0.15);border:2px solid ${node.cor};border-radius:10px;padding:10px 16px;`,
      tarefa: `background:rgba(${hexToRgb(node.cor)},0.08);border:1px solid ${node.cor};border-radius:8px;padding:8px 14px;`,
      subtarefa: `background:#12151C;border:1px solid #1E2535;border-radius:6px;padding:6px 12px;`,
    };
    const style = typeStyles[node.tipo] || typeStyles.tarefa;
    const labelSize = node.tipo === 'fase' ? '14px' : node.tipo === 'tarefa' ? '12px' : '11px';
    const labelColor = node.tipo === 'fase' ? node.cor : node.tipo === 'tarefa' ? '#E8E9EC' : '#94A3B8';

    const childrenHTML = node.children.length > 0
      ? `<div style="display:flex;flex-direction:column;gap:8px;padding-left:32px;position:relative">
          <div style="position:absolute;left:0;top:0;bottom:0;width:2px;background:${node.cor};opacity:0.3;margin-left:-1px"></div>
          ${node.children.map(c => renderNode(c, depth+1)).join('')}
        </div>`
      : '';

    return `<div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:0">
        ${depth > 0 ? `<div style="width:24px;height:2px;background:${node.cor};opacity:0.4;flex-shrink:0"></div>` : ''}
        <div style="${style}min-width:${node.tipo==='fase'?'200px':node.tipo==='tarefa'?'180px':'160px'};max-width:${node.tipo==='fase'?'240px':'200px'}">
          <div style="font-family:Arial;font-size:${labelSize};color:${labelColor};font-weight:${node.tipo==='fase'?'700':'500'};line-height:1.3">${node.label}</div>
          ${node.descricao ? `<div style="font-family:Arial;font-size:10px;color:#64748B;margin-top:2px">${node.descricao}</div>` : ''}
        </div>
      </div>
      ${childrenHTML}
    </div>`;
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `${r},${g},${b}`;
  }

  const treeHTML = roots.map(r => renderNode(r, 0)).join('<div style="height:24px"></div>');

  return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama de Árvore — ${sessionName}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0C10;font-family:Arial,sans-serif;padding:32px;color:#E8E9EC}
.page{max-width:1200px;margin:0 auto}
h1{font-family:Georgia,serif;color:#E8C872;font-size:22px;margin-bottom:4px}
.sub{color:#64748B;font-size:12px;margin-bottom:16px}
.obj{background:#0F1B35;border-radius:12px;padding:16px 20px;margin-bottom:28px;display:flex;align-items:center;gap:12px;border:1px solid rgba(232,200,114,.2)}
.obj-icon{width:44px;height:44px;background:linear-gradient(135deg,#E8C872,#F5D78E);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.obj-title{font-size:16px;font-weight:700;color:#E8C872}
.obj-sub{font-size:12px;color:#64748B;margin-top:2px}
.tree-wrap{background:#0A0C10;border:1px solid #1E2535;border-radius:12px;padding:24px;overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px;background:#12151C;border:1px solid #1E2535;border-radius:10px;margin-top:12px}
.li{display:flex;align-items:center;gap:8px;font-size:11px;color:#94A3B8}
.lb{width:16px;height:16px;border-radius:3px}
footer{text-align:center;font-size:11px;color:#334155;margin-top:28px;padding-top:14px;border-top:1px solid #1E2535}
</style>
</head>
<body>
<div class="page">
<h1>Diagrama de Árvore — ${sessionName}</h1>
<div class="sub">${today} · Colink Business Consulting</div>
<div class="obj">
  <div class="obj-icon">🎯</div>
  <div><div class="obj-title">${objetivo}</div><div class="obj-sub">Desdobramento hierárquico de fases, tarefas e subtarefas</div></div>
</div>
<div class="tree-wrap">
  <div style="display:flex;flex-direction:row;gap:24px;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto">
    ${treeHTML}
  </div>
</div>
<div class="legend">
  <div class="li"><div class="lb" style="background:#4A90E2;border-radius:5px"></div>Fase (nível 1)</div>
  <div class="li"><div class="lb" style="background:#1E2535;border:1px solid #4A90E2"></div>Tarefa (nível 2)</div>
  <div class="li"><div class="lb" style="background:#12151C;border:1px solid #1E2535"></div>Subtarefa (nível 3)</div>
  <div class="li" style="color:#475569">Leia da esquerda para direita: objetivo → fases → tarefas → subtarefas</div>
</div>
<footer>Colink Business Consulting · colink.com.br · ${today}</footer>
</div>
</body>
</html>`;
}

// SCENARIO MAP — Mapa de Cenários com Probabilidades
// ═══════════════════════════════════════════════════════════════════════
function generateScenarioMap(d, sessionName, today) {
  const titulo = d ? d.titulo : 'Mapa de Cenários — ' + sessionName;
  const decisao = d ? d.decisao_central : 'Implementar transformação do processo';
  const cenarios = d ? (d.cenarios || []) : [];
  const fatores = d ? (d.fatores_criticos || []) : [];

  const defaultCenarios = [
    {id:'C1',nome:'Cenário Otimista',descricao:'Implementação completa com alta adoção do time',probabilidade:35,cor:'#3ECF8E',tipo:'otimista',metricas:{conversao:'18%',roi_12m:'R$ 280k',payback:'4m',risco:'Baixo'},condicoes:['Time engajado','CRM limpo','Budget aprovado'],acoes:['Implementar todos os módulos','Treinar 100% do time']},
    {id:'C2',nome:'Cenário Base',descricao:'Implementação gradual com adoção moderada',probabilidade:45,cor:'#4A90E2',tipo:'base',metricas:{conversao:'13%',roi_12m:'R$ 180k',payback:'7m',risco:'Médio'},condicoes:['Resistência parcial','Dados parcialmente limpos'],acoes:['Quick Wins primeiro','Revisão trimestral']},
    {id:'C3',nome:'Cenário Pessimista',descricao:'Apenas Quick Wins por resistência ou budget',probabilidade:20,cor:'#F87171',tipo:'pessimista',metricas:{conversao:'10%',roi_12m:'R$ 80k',payback:'11m',risco:'Alto'},condicoes:['Alta resistência','Budget cortado'],acoes:['Focar em Quick Wins','Revisitar em 6 meses']},
  ];
  const items = cenarios.length > 0 ? cenarios : defaultCenarios;

  const fatorStatus = { 'Aprovado':'#3ECF8E','Confirmado':'#3ECF8E','Crítico':'#F87171','Risco':'#F87171','Incerto':'#FB923C','Em análise':'#FB923C','OK':'#3ECF8E' };

  const cenariosHTML = items.map(c => {
    const prob = c.probabilidade || 0;
    const barW = Math.round(prob * 2.2);
    const metricsList = Object.entries(c.metricas || {}).map(([k,v]) =>
      `<div style="background:#0A0C10;border-radius:6px;padding:8px 10px;text-align:center">
        <div style="font-size:15px;font-weight:700;color:${c.cor}">${v}</div>
        <div style="font-size:9px;color:#64748B;margin-top:2px;text-transform:capitalize">${k.replace('_',' ')}</div>
      </div>`
    ).join('');

    return `<div style="background:#12151C;border:1px solid ${c.cor};border-radius:12px;padding:20px 22px;border-top:3px solid ${c.cor}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div>
          <div style="font-size:15px;font-weight:700;color:${c.cor};margin-bottom:3px">${c.nome}</div>
          <div style="font-size:12px;color:#94A3B8;line-height:1.4;max-width:380px">${c.descricao}</div>
        </div>
        <div style="text-align:center;min-width:70px">
          <div style="font-size:28px;font-weight:700;color:${c.cor}">${prob}%</div>
          <div style="font-size:9px;color:#64748B">probabilidade</div>
        </div>
      </div>
      <!-- Probability bar -->
      <div style="background:#1E2535;border-radius:4px;height:6px;margin-bottom:16px;overflow:hidden">
        <div style="width:${barW}px;max-width:100%;height:100%;background:${c.cor};border-radius:4px;transition:width .3s"></div>
      </div>
      <!-- Metrics -->
      <div style="display:grid;grid-template-columns:repeat(${Math.min(Object.keys(c.metricas||{}).length,4)},1fr);gap:8px;margin-bottom:14px">
        ${metricsList}
      </div>
      <!-- Conditions + Actions -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:10px;color:#64748B;font-weight:700;letter-spacing:.08em;margin-bottom:6px">CONDIÇÕES</div>
          ${(c.condicoes||[]).map(cond => `<div style="font-size:11px;color:#94A3B8;padding:3px 0;border-bottom:1px solid #1E2535;display:flex;gap:6px"><span style="color:${c.cor}">•</span>${cond}</div>`).join('')}
        </div>
        <div>
          <div style="font-size:10px;color:#64748B;font-weight:700;letter-spacing:.08em;margin-bottom:6px">AÇÕES CHAVE</div>
          ${(c.acoes||[]).map(a => `<div style="font-size:11px;color:#94A3B8;padding:3px 0;border-bottom:1px solid #1E2535;display:flex;gap:6px"><span style="color:${c.cor}">→</span>${a}</div>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  const totalProb = items.reduce((s,c) => s+(c.probabilidade||0), 0);
  const probChart = items.map(c => {
    const angle = ((c.probabilidade||0) / totalProb) * 360;
    return { ...c, angle };
  });

  const fatoresHTML = fatores.length > 0 ? fatores.map(f => {
    const sc = fatorStatus[f.status] || '#FB923C';
    const pesoColors = {'Alto':'#F87171','Médio':'#FB923C','Baixo':'#3ECF8E'};
    const pc = pesoColors[f.peso] || '#64748B';
    return `<div style="background:#12151C;border:1px solid #1E2535;border-radius:8px;padding:12px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:12px;font-weight:600;color:#E8E9EC">${f.fator}</div>
        <div style="display:flex;gap:6px">
          <span style="font-size:9px;background:${pc}22;color:${pc};border:1px solid ${pc}44;padding:2px 8px;border-radius:10px;font-weight:600">${f.peso}</span>
          <span style="font-size:9px;background:${sc}22;color:${sc};border:1px solid ${sc}44;padding:2px 8px;border-radius:10px;font-weight:600">${f.status}</span>
        </div>
      </div>
      <div style="font-size:11px;color:#64748B;display:flex;gap:6px"><span style="color:#E8C872">Mitigação:</span>${f.mitigacao||''}</div>
    </div>`;
  }).join('') : '';

  return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Cenários — ${sessionName}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0C10;font-family:Arial,sans-serif;padding:32px;color:#E8E9EC}
.page{max-width:1100px;margin:0 auto}
h1{font-family:Georgia,serif;color:#E8C872;font-size:22px;margin-bottom:4px}
.sub{color:#64748B;font-size:12px;margin-bottom:20px}
.decisao{background:#0F1B35;border-radius:12px;padding:16px 20px;margin-bottom:24px;border:1px solid rgba(232,200,114,.2);display:flex;align-items:center;gap:12px}
.dec-icon{font-size:24px}
.dec-label{font-size:10px;color:#64748B;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.dec-text{font-size:15px;font-weight:600;color:#E8C872}
.section-title{font-size:10px;font-weight:700;letter-spacing:.12em;color:#64748B;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:#1E2535}
.cenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px}
.fatores{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:24px}
footer{text-align:center;font-size:11px;color:#334155;margin-top:28px;padding-top:14px;border-top:1px solid #1E2535}
</style>
</head>
<body>
<div class="page">
<h1>Mapa de Cenários — ${sessionName}</h1>
<div class="sub">${today} · Colink Business Consulting · Análise de Probabilidades e Riscos</div>
<div class="decisao">
  <div class="dec-icon">🎲</div>
  <div><div class="dec-label">Decisão central analisada</div><div class="dec-text">${decisao}</div></div>
</div>
<div class="section-title">Cenários e probabilidades</div>
<div class="cenarios">${cenariosHTML}</div>
${fatores.length > 0 ? `<div class="section-title">Fatores críticos de sucesso</div><div class="fatores">${fatoresHTML}</div>` : ''}
<footer>Colink Business Consulting · colink.com.br · ${today}</footer>
</div>
</body>
</html>`;
}
